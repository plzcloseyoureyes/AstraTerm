name: Release

# Pushing a version tag (v1.2.3, v1.2.3-rc.1) builds the web UI once, cross-compiles every platform with GoReleaser
# (.goreleaser.yaml), and creates a DRAFT GitHub release with the archives, SHA256SUMS, one SBOM per archive and a
# build-provenance attestation. Review the draft, then publish it by hand (docs/RELEASING.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  GORELEASER_VERSION: "v2.18.2" # keep in sync with GORELEASER_VERSION in the Makefile

jobs:
  release:
    name: Build and draft the release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # create the draft release and upload assets
      id-token: write # sign the provenance attestation (Sigstore)
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser needs the tags and history
          persist-credentials: false

      - name: Require a license
        run: |
          if ! ls LICENSE* >/dev/null 2>&1; then
            echo "::error::No LICENSE file: choose a license and commit it before releasing (docs/RELEASING.md)."
            exit 1
          fi

      - name: Release notes from CHANGELOG.md
        run: scripts/release/changelog-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build the web UI once (npm ci, vite build, precompress)
        run: make web

      - name: Third-party notices match the tagged dependencies
        run: make notices-check

      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build-provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
