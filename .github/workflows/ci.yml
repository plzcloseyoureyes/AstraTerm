name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24"

jobs:
  web:
    name: Web UI (typecheck, lint, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install dependencies (lockfile)
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Lint (oxlint)
        working-directory: web
        run: npm run lint
      - name: UI guardrail (loading states)
        run: node scripts/lint-ui.mjs
      - name: Unit tests
        working-directory: web
        run: npm test
      - name: Build and precompress
        run: |
          (cd web && npm run build)
          go run ./internal/webui/precompress internal/webui/dist
      - name: Third-party notices up to date
        # Dependency bumps (e.g. Dependabot) change the notices; release.yml enforces them, here it is a warning.
        continue-on-error: true
        run: go run ./scripts/release/notices -check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webui-dist
          path: internal/webui/dist
          retention-days: 7
          if-no-files-found: error

  go:
    name: Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Keep LF line endings (gofmt, test data)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: make fmt-check
      - name: go vet
        run: go vet ./...
      - name: go test -race
        env:
          CGO_ENABLED: "1" # the race detector needs cgo; release builds stay CGO_ENABLED=0
        run: go test -race ./...

  dist:
    name: Cross-compile and package
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # version and build date come from git
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: webui-dist
          path: internal/webui/dist
      - name: Compile every package for every platform
        run: make cross-check
      - name: Release archives
        run: make dist
      - name: Smoke test (linux/amd64)
        run: |
          bin=dist/build/linux_amd64/termstead
          "$bin" version
          export HOME="$RUNNER_TEMP/home" && mkdir -p "$HOME"
          "$bin" --listen 127.0.0.1:47822 --no-open --data-dir "$RUNNER_TEMP/data" &
          curl -fsS --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:47822/api/auth/state
          curl -fsS --compressed -o /dev/null -w 'index: %{http_code}\n' http://127.0.0.1:47822/
          kill %1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          retention-days: 7
