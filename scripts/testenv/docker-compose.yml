# Shared test targets for NexTerm development & e2e tests.
#   docker compose -f scripts/testenv/docker-compose.yml up -d
# All ports bind to 127.0.0.1 only. Credentials are throwaway test values.
#
#   service   host port        credentials / notes
#   ssh1      22022            test / test  (also key: scripts/testenv/keys/id_ed25519) — tcp forwarding enabled
#   ssh2      (internal only)  test / test  — reachable as ssh2:2222 from ssh1 (jump-host target)
#   web       (internal only)  nginx on web:80, reachable through ssh1 (tunnel / webproxy target)
#   telnet    22023            busybox telnetd, no auth → /bin/sh
#   ftp       22021 (+21100-21110 passive)  test / test
#   vnc       22059            VNC password: vncpassword  (XFCE desktop on :1)
#   rdp       22089            ubuntu / ubuntu (xrdp, TLS security)
#   guacd     22822            guacamole/guacd 1.6
#   s3        22090            SeaweedFS S3 API, access key nexterm / secret nexterm-secret (create buckets via API), path-style
#   webdav    22080            test / test
#   smb       22445            test / test, share "share"
name: nexterm-testenv

networks:
  lab:
    driver: bridge

services:
  ssh1:
    image: lscr.io/linuxserver/openssh-server:latest
    hostname: ssh1
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - PASSWORD_ACCESS=true
      - USER_NAME=test
      - USER_PASSWORD=test
      - SUDO_ACCESS=true
      - PUBLIC_KEY_FILE=/keys/id_ed25519.pub
      - DOCKER_MODS=linuxserver/mods:openssh-server-ssh-tunnel
    volumes:
      - ./keys:/keys:ro
    ports:
      - "127.0.0.1:22022:2222"
    networks: [lab]
    restart: unless-stopped

  ssh2:
    image: lscr.io/linuxserver/openssh-server:latest
    hostname: ssh2
    environment:
      - PUID=1000
      - PGID=1000
      - PASSWORD_ACCESS=true
      - USER_NAME=test
      - USER_PASSWORD=test
      - PUBLIC_KEY_FILE=/keys/id_ed25519.pub
    volumes:
      - ./keys:/keys:ro
    networks: [lab]
    restart: unless-stopped

  web:
    image: nginx:alpine
    hostname: web
    networks: [lab]
    restart: unless-stopped

  telnet:
    image: alpine:3
    hostname: telnet
    command: ["sh", "-c", "apk add --no-cache busybox-extras >/dev/null && exec busybox-extras telnetd -F -p 23 -l /bin/sh"]
    ports:
      - "127.0.0.1:22023:23"
    networks: [lab]
    restart: unless-stopped

  ftp:
    image: delfer/alpine-ftp-server:latest
    environment:
      - USERS=test|test
      - ADDRESS=127.0.0.1
      - MIN_PORT=21100
      - MAX_PORT=21110
    ports:
      - "127.0.0.1:22021:21"
      - "127.0.0.1:21100-21110:21100-21110"
    networks: [lab]
    restart: unless-stopped

  vnc:
    image: consol/debian-xfce-vnc:latest
    environment:
      - VNC_PW=vncpassword
      - VNC_RESOLUTION=1280x800
    ports:
      - "127.0.0.1:22059:5901"
    networks: [lab]
    restart: unless-stopped

  rdp:
    image: scottyhardy/docker-remote-desktop:latest
    hostname: rdp
    shm_size: 1g
    ports:
      - "127.0.0.1:22089:3389"
    networks: [lab]
    restart: unless-stopped

  guacd:
    image: guacamole/guacd:1.6.0
    ports:
      - "127.0.0.1:22822:4822"
    networks: [lab]
    restart: unless-stopped

  s3:
    image: chrislusf/seaweedfs:latest
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/nexterm/s3.json", "-ip.bind=0.0.0.0"]
    volumes:
      - ./s3.json:/etc/nexterm/s3.json:ro
    ports:
      - "127.0.0.1:22090:8333"
    networks: [lab]
    restart: unless-stopped

  webdav:
    image: bytemark/webdav:latest
    environment:
      - AUTH_TYPE=Basic
      - USERNAME=test
      - PASSWORD=test
    ports:
      - "127.0.0.1:22080:80"
    networks: [lab]
    restart: unless-stopped

  smb:
    image: dperson/samba:latest
    command: ["-u", "test;test", "-s", "share;/share;yes;no;no;test"]
    ports:
      - "127.0.0.1:22445:445"
    networks: [lab]
    restart: unless-stopped
